[package]
name = "clipd"
version = "0.1.0"
edition = "2021"
description = "Minimal Plasma Wayland clipboard history (daemon + popup)"
license = "MIT"
readme = "README.md"
keywords = ["clipboard", "wayland", "plasma", "kde"]
categories = ["command-line-utilities"]
repository = "https://github.com/havedill/clipd"
homepage = "https://github.com/havedill/clipd"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
eframe = { version = "0.31", default-features = false, features = ["wayland", "x11", "default_fonts", "glow"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ksni = "0.2"
